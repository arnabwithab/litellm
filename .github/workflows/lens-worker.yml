name: Lens Worker Image

on:
  pull_request:
    branches: [main, litellm_oss_branch, "litellm_**"]
    paths:
      - deploy/lens/**
      - litellm/proxy/engine/**
      - .github/workflows/lens-worker.yml
  push:
    branches: [main, litellm_agent_engine]
    paths:
      - deploy/lens/**
      - litellm/proxy/engine/**
      - .github/workflows/lens-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lens-worker-image:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Lens worker
        run: docker build -f deploy/lens/Dockerfile -t lens-worker:${{ github.sha }} .
      - name: Verify standalone imports with a read-only filesystem
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --entrypoint python
          lens-worker:${{ github.sha }}
          -c 'import os; import engine.worker; assert os.getuid() == 65532'
      - name: Publish versioned Lens worker
        if: github.event_name != 'pull_request' && github.repository == 'BerriAI/litellm'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE: ghcr.io/berriai/litellm-lens-worker:sha-${{ github.sha }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker tag lens-worker:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"
          printf 'Lens worker image: `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
